<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f3faf7"/>
      <stop offset="1" stop-color="#edf7f2"/>
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbf8"/>
      <stop offset="1" stop-color="#e7f4ee"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65e2b2"/>
      <stop offset="1" stop-color="#58bfe8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#274e40" flood-opacity="0.13"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#65e2b2"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 4px; fill: #118562; }
      .title { font-size: 58px; font-weight: 760; fill: #10281f; }
      .subtitle { font-size: 25px; font-weight: 450; fill: #587066; }
      .section { font-size: 24px; font-weight: 750; letter-spacing: 2px; fill: #355d4e; }
      .cardTitle { font-size: 25px; font-weight: 720; fill: #10281f; }
      .cardBody { font-size: 19px; font-weight: 450; fill: #50695f; }
      .small { font-size: 17px; font-weight: 520; fill: #647c72; }
      .pill { font-size: 18px; font-weight: 700; fill: #176a50; }
      .flow { fill: none; stroke: #21aa7e; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .flowMuted { fill: none; stroke: #80b9a4; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2400" height="1350" fill="url(#bg)"/>
  <circle cx="2150" cy="90" r="330" fill="#b9e5d4" opacity="0.24"/>
  <circle cx="210" cy="1240" r="360" fill="#c8e9f2" opacity="0.22"/>
  <path d="M0 184 H2400" stroke="#d3e7de" stroke-width="2"/>

  <g class="sans">
    <g transform="translate(82 54)">
      <circle cx="48" cy="48" r="44" fill="none" stroke="url(#mint)" stroke-width="4"/>
      <path d="M18 61 C34 53 38 35 55 39 C65 42 68 28 81 24" fill="none" stroke="#65e2b2" stroke-width="7" stroke-linecap="round"/>
      <circle cx="55" cy="39" r="7" fill="#65e2b2"/>
      <text x="116" y="43" class="eyebrow">TERRA PULSE</text>
      <text x="116" y="93" class="title">Evidence-aware Earth intelligence</text>
    </g>
    <text x="2318" y="92" text-anchor="end" class="subtitle">One edge deployment · Six live feeds · Explicit uncertainty</text>

    <text x="76" y="244" class="section">AUTHORITATIVE PUBLIC SIGNALS</text>
    <text x="724" y="244" class="section">CLOUDFLARE WORKER · /api/*</text>
    <text x="1870" y="244" class="section">EXPLORATION EXPERIENCE</text>

    <!-- Source cards -->
    <g filter="url(#shadow)">
      <rect x="70" y="282" width="530" height="128" rx="18" fill="#ffffff" stroke="#b8d6ca" stroke-width="2"/>
      <circle cx="112" cy="326" r="14" fill="#f4ad57"/>
      <text x="144" y="326" class="cardTitle">USGS</text>
      <text x="144" y="362" class="cardBody">Earthquakes · elevated volcano alerts</text>
      <rect x="440" y="303" width="130" height="38" rx="19" fill="#e1f2ea"/>
      <text x="505" y="329" text-anchor="middle" class="pill">5–15 min</text>

      <rect x="70" y="430" width="530" height="128" rx="18" fill="#ffffff" stroke="#b8d6ca" stroke-width="2"/>
      <circle cx="112" cy="474" r="14" fill="#ff7255"/>
      <text x="144" y="474" class="cardTitle">NASA EONET</text>
      <text x="144" y="510" class="cardBody">Wildfires · storms · floods · sea ice</text>
      <rect x="440" y="451" width="130" height="38" rx="19" fill="#e1f2ea"/>
      <text x="505" y="477" text-anchor="middle" class="pill">15 min</text>

      <rect x="70" y="578" width="530" height="128" rx="18" fill="#ffffff" stroke="#b8d6ca" stroke-width="2"/>
      <circle cx="112" cy="622" r="14" fill="#58bfe8"/>
      <text x="144" y="622" class="cardTitle">NOAA / NWS</text>
      <text x="144" y="658" class="cardBody">Active U.S. weather and hazard alerts</text>
      <rect x="440" y="599" width="130" height="38" rx="19" fill="#e1f2ea"/>
      <text x="505" y="625" text-anchor="middle" class="pill">10 min</text>

      <rect x="70" y="726" width="530" height="128" rx="18" fill="#ffffff" stroke="#b8d6ca" stroke-width="2"/>
      <circle cx="112" cy="770" r="14" fill="#8cd7ef"/>
      <text x="144" y="770" class="cardTitle">Open-Meteo / CAMS</text>
      <text x="144" y="806" class="cardBody">Weather · modeled regional air quality</text>
      <rect x="440" y="747" width="130" height="38" rx="19" fill="#e1f2ea"/>
      <text x="505" y="773" text-anchor="middle" class="pill">15–30 min</text>

      <rect x="70" y="874" width="530" height="128" rx="18" fill="#ffffff" stroke="#b8d6ca" stroke-width="2"/>
      <circle cx="112" cy="918" r="14" fill="#d9a861"/>
      <text x="144" y="918" class="cardTitle">GDACS</text>
      <text x="144" y="954" class="cardBody">Recently updated drought alerts</text>
      <rect x="440" y="895" width="130" height="38" rx="19" fill="#e1f2ea"/>
      <text x="505" y="921" text-anchor="middle" class="pill">30 min</text>

      <rect x="70" y="1022" width="530" height="128" rx="18" fill="#ffffff" stroke="#b8d6ca" stroke-width="2"/>
      <circle cx="112" cy="1066" r="14" fill="#65e2b2"/>
      <text x="144" y="1066" class="cardTitle">OpenStreetMap</text>
      <text x="144" y="1102" class="cardBody">Overpass · mapped hospitals within 50 km</text>
      <rect x="440" y="1043" width="130" height="38" rx="19" fill="#e1f2ea"/>
      <text x="505" y="1069" text-anchor="middle" class="pill">6 hours</text>
    </g>

    <!-- Worker boundary -->
    <rect x="680" y="270" width="1100" height="880" rx="30" fill="url(#worker)" stroke="#72ad96" stroke-width="3" filter="url(#shadow)"/>
    <rect x="714" y="304" width="1032" height="88" rx="16" fill="#ffffff" stroke="#7dbda3" stroke-width="2"/>
    <text x="758" y="342" class="cardTitle">Worker router + static asset binding</text>
    <text x="758" y="374" class="cardBody">Static files bypass application execution · API requests enter a bounded pipeline</text>
    <rect x="1514" y="327" width="194" height="40" rx="20" fill="#dcefe7"/>
    <text x="1611" y="354" text-anchor="middle" class="pill">TypeScript monorepo</text>

    <rect x="734" y="440" width="446" height="148" rx="20" fill="#ffffff" stroke="#9bc8b6" stroke-width="2"/>
    <text x="770" y="480" class="eyebrow" style="font-size:18px">01 · COLLECT</text>
    <text x="770" y="522" class="cardTitle">Parallel source adapters</text>
    <text x="770" y="555" class="cardBody">Independent failure · validation · timeouts</text>

    <rect x="1280" y="440" width="446" height="148" rx="20" fill="#ffffff" stroke="#9bc8b6" stroke-width="2"/>
    <text x="1316" y="480" class="eyebrow" style="font-size:18px">02 · NORMALIZE</text>
    <text x="1316" y="522" class="cardTitle">Shared Earth event model</text>
    <text x="1316" y="555" class="cardBody">Geometry · provenance · severity · time</text>

    <path d="M1180 514 H1280" class="flow"/>

    <rect x="734" y="640" width="446" height="170" rx="20" fill="#ffffff" stroke="#9bc8b6" stroke-width="2"/>
    <text x="770" y="680" class="eyebrow" style="font-size:18px">03 · ENRICH</text>
    <text x="770" y="722" class="cardTitle">Event context</text>
    <text x="770" y="755" class="cardBody">Weather · air · cities · hospitals</text>
    <text x="770" y="785" class="small">Unavailable context remains UNKNOWN</text>

    <rect x="1280" y="640" width="446" height="170" rx="20" fill="#f3fbf7" stroke="#21aa7e" stroke-width="3"/>
    <text x="1316" y="680" class="eyebrow" style="font-size:18px">04 · REASON</text>
    <text x="1316" y="722" class="cardTitle">Deterministic intelligence</text>
    <text x="1316" y="755" class="cardBody">Priority · clustering · evidence · timeline</text>
    <text x="1316" y="785" class="small">Observed · Computed · Inferred · Unknown</text>

    <path d="M1503 588 V640" class="flow"/>
    <path d="M1180 725 H1280" class="flow"/>

    <rect x="734" y="862" width="992" height="126" rx="20" fill="#ffffff" stroke="#76b59d" stroke-width="2"/>
    <text x="770" y="903" class="eyebrow" style="font-size:18px">05 · EXPLAIN</text>
    <text x="770" y="946" class="cardTitle">Evidence packet → constrained Workers AI → natural-language explanation</text>
    <text x="770" y="974" class="small">Deterministic answer survives model failure · no invented impacts or forecasts</text>
    <path d="M1503 810 V862" class="flow"/>

    <!-- Storage -->
    <text x="734" y="1040" class="section">STATE + RESILIENCE</text>
    <rect x="734" y="1062" width="302" height="62" rx="15" fill="#deefe7" stroke="#8ebdaa"/>
    <text x="885" y="1101" text-anchor="middle" class="cardTitle" style="font-size:21px">KV · source cache</text>
    <rect x="1078" y="1062" width="302" height="62" rx="15" fill="#deefe7" stroke="#8ebdaa"/>
    <text x="1229" y="1101" text-anchor="middle" class="cardTitle" style="font-size:21px">D1 · event history</text>
    <rect x="1422" y="1062" width="304" height="62" rx="15" fill="#deefe7" stroke="#8ebdaa"/>
    <text x="1574" y="1091" text-anchor="middle" class="cardTitle" style="font-size:21px">Durable Object</text>
    <text x="1574" y="1116" text-anchor="middle" class="small">SQLite Ask Earth session</text>

    <!-- Main ingress arrows -->
    <path d="M600 346 H650 V514 H734" class="flow"/>
    <path d="M600 494 H650" class="flowMuted"/>
    <path d="M600 642 H650" class="flowMuted"/>
    <path d="M600 790 H650 V725 H734" class="flow"/>
    <path d="M600 938 H650" class="flowMuted"/>
    <path d="M600 1086 H650 V725 H734" class="flow"/>

    <!-- Experience -->
    <g filter="url(#shadow)">
      <rect x="1850" y="282" width="480" height="194" rx="22" fill="#ffffff" stroke="#88bca8" stroke-width="2"/>
      <text x="1890" y="326" class="eyebrow" style="font-size:18px">REACT · VITE · MAPLIBRE</text>
      <text x="1890" y="372" class="cardTitle">Living Earth dashboard</text>
      <text x="1890" y="408" class="cardBody">3D globe · seven layers · search</text>
      <text x="1890" y="440" class="cardBody">balanced priority feed · responsive UI</text>

      <rect x="1850" y="516" width="480" height="194" rx="22" fill="#ffffff" stroke="#88bca8" stroke-width="2"/>
      <text x="1890" y="560" class="eyebrow" style="font-size:18px">EVENT INTELLIGENCE</text>
      <text x="1890" y="606" class="cardTitle">Inspect the evidence</text>
      <text x="1890" y="642" class="cardBody">Brief · evidence · timeline</text>
      <text x="1890" y="674" class="cardBody">context metrics · relationship graph</text>

      <rect x="1850" y="750" width="480" height="194" rx="22" fill="#f3fbf7" stroke="#21aa7e" stroke-width="3"/>
      <text x="1890" y="794" class="eyebrow" style="font-size:18px">ASK EARTH</text>
      <text x="1890" y="840" class="cardTitle">Question → grounded answer</text>
      <text x="1890" y="876" class="cardBody">Global or selected-event questions</text>
      <text x="1890" y="908" class="cardBody">citations · limits · short session memory</text>

      <rect x="1850" y="984" width="480" height="166" rx="22" fill="#ffffff" stroke="#88bca8" stroke-width="2"/>
      <text x="1890" y="1028" class="eyebrow" style="font-size:18px">TRUST CONTRACT</text>
      <text x="1890" y="1072" class="cardTitle">Unknown stays unknown</text>
      <text x="1890" y="1107" class="cardBody">Sources, timestamps, classifications,</text>
      <text x="1890" y="1137" class="cardBody">confidence, and limitations stay visible</text>
    </g>

    <path d="M1726 925 H1792 V379 H1850" class="flow"/>
    <path d="M1792 613 H1850" class="flow"/>
    <path d="M1792 847 H1850" class="flow"/>
    <path d="M1792 1067 H1850" class="flowMuted"/>

    <!-- Footer -->
    <rect x="70" y="1208" width="2260" height="82" rx="20" fill="#ffffff" stroke="#b8d6ca" stroke-width="2"/>
    <circle cx="112" cy="1249" r="10" fill="#65e2b2" filter="url(#glow)"/>
    <text x="138" y="1258" class="cardBody" style="font-size:21px">15-minute scheduled collection</text>
    <circle cx="630" cy="1249" r="10" fill="#65e2b2"/>
    <text x="656" y="1258" class="cardBody" style="font-size:21px">Bounded requests, history, and AI output</text>
    <circle cx="1260" cy="1249" r="10" fill="#65e2b2"/>
    <text x="1286" y="1258" class="cardBody" style="font-size:21px">Per-source failure isolation</text>
    <circle cx="1770" cy="1249" r="10" fill="#65e2b2"/>
    <text x="1796" y="1258" class="cardBody" style="font-size:21px">Explicitly labeled fallback—not fake live data</text>

    <text x="2328" y="1324" text-anchor="end" class="small">terrapulse.troche.workers.dev · github.com/jose-troche/terra-pulse</text>
  </g>
</svg>
